project:
  name: cross_asset_stress
  title: "Cross-Asset Stress Monitor: Cross-Asset Implied Stress and Equity Drawdown Protection"
  seed: 42

paths:
  data_dir: data
  synthetic_dir: data/synthetic
  processed_dir: data/processed
  experiment_registry: docs/experiment_registry.md

synthetic:
  start: "1995-01-02"
  end: "2025-12-31"
  seed: 42

target:
  name: drawdown_5pct_h20
  horizon_days: 20
  drawdown_threshold: 0.05
  volatility_quantile: 0.95
  vix_threshold: 35.0

validation:
  split: purged_time_series
  n_splits: 3
  train_fraction: 0.70
  purge_horizon_days: 20
  embargo_days: 5

models:
  primary_benchmark: logistic_regression
  include_leaky_diagnostic: true


agent_schema:
  required_fields:
    - as_of_timestamp
    - forecast_horizon_days
    - event_definition
    - probability
    - confidence
    - risk_factors
    - counterarguments
    - evidence_ids
    - data_quality_flags
    - abstain

conditions:
  A_structured_only_benchmark:
    uses_llm: false
  B_text_only_point_in_time_agent:
    allowed_inputs: [point_in_time_documents]
  C_structured_summary_agent:
    allowed_inputs: [deterministic_structured_summary]
  D_hybrid_point_in_time_agent:
    allowed_inputs: [point_in_time_documents, deterministic_structured_summary]
  E_sanitized_history_agent:
    transforms:
      - remove_dates
      - remove_event_names
      - remove_future_tense_clues
      - entity_anonymization
  F_placebo_context_agent:
    transforms:
      - shuffled_documents
      - irrelevant_documents
  G_deliberately_contaminated_agent:
    valid_forecast: false
    purpose: "Diagnostic upper bound for performance inflation."
  H_numeric_only_anonymized_experiment:
    allowed_inputs: [anonymous_numeric_features]

open_source_first:
  provider: mock
  optional_local_provider: ollama
  ollama_base_url_env: OLLAMA_BASE_URL
  ollama_model_env: CHRONOSWAN_LOCAL_MODEL
  future_candidates:
    - llama
    - mistral
    - qwen
    - deepseek
  note: "Local or open-weight integrations should preserve full prompt and context hashes."

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chronoswan"
version = "0.1.0"
description = "Point-in-time research scaffold for extreme market-risk detection with leakage-aware LLM agents."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "matplotlib>=3.8",
  "numpy>=1.26",
  "pandas>=2.1",
  "pyarrow>=15",
  "pydantic>=2",
  "pyyaml>=6",
  "scikit-learn>=1.4",
  "statsmodels>=0.14",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.6",
]

[project.scripts]
chronoswan = "chronoswan.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/chronoswan"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

